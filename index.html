<!DOCTYPE html>
<html>
<head>
    <title>Smart Translator</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 350px;
        }

        textarea, select {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
        }

        button {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>🌐 Smart Translator</h2>

    <form method="POST">
        <textarea name="text" placeholder="Enter text" required></textarea>

        <select name="language" required>
            <option value="hi">Hindi</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="te">Telugu</option>
            <option value="ta">Tamil</option>
        </select>

        <button type="submit">Translate</button>
    </form>

    {% if result %}
        <h3>Result:</h3>
        <p>{{ result }}</p>
    {% endif %}
</div>

</body>
</html>
